name: Deploy to Markt Server
# Triggered after successful CI on develop (workflow_run) or manually (workflow_dispatch).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to test server over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'develop'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/markt.pem
          chmod 600 ~/.ssh/markt.pem
          if [ -n "${{ secrets.SERVER_HOST_KEY }}" ]; then
            echo "${{ secrets.SERVER_HOST_KEY }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          fi

      - name: Deploy Application
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/markt.pem ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'

          set -euo pipefail

          sudo -i -u ubuntu bash <<'INNER_EOF'
          set -euo pipefail
          cd /home/ubuntu/markt/apps/markt_python/
          source .venv/bin/activate

          # Keep target branch current and install dependency updates before migrations.
          git fetch origin develop
          git checkout develop
          git pull origin develop

          pip install -r requirements/dev-requirements.txt

          export FLASK_APP=main.setup:create_flask_app
          flask db upgrade

          INNER_EOF

          sudo systemctl daemon-reload
          sudo systemctl restart markt markt-celery
          sudo systemctl is-active --quiet markt
          sudo systemctl is-active --quiet markt-celery

          # Prefer explicit health URL when provided, otherwise default to localhost.
          HEALTHCHECK_URL=${{ secrets.HEALTHCHECK_URL }}
          if [ -z "$HEALTHCHECK_URL" ]; then
            HEALTHCHECK_URL="http://127.0.0.1/health/"
          fi

          # Retry health check to tolerate normal app warm-up. The app needs
          # ~7s just to register blueprints under the Flask CLI, and gunicorn
          # additionally runs gevent's patch_all() over the full import graph,
          # so give it two minutes rather than thirty seconds.
          ATTEMPTS=24
          for i in $(seq 1 "$ATTEMPTS"); do
            if curl -fsS --max-time 10 "$HEALTHCHECK_URL" > /dev/null; then
              echo "Health check passed on attempt $i ($(( (i - 1) * 5 ))s after restart)"
              break
            fi
            if [ "$i" -eq "$ATTEMPTS" ]; then
              echo "Health check failed after $ATTEMPTS attempts. Service state follows."
              sudo systemctl status markt --no-pager -l | tail -40 || true
              echo "--- journal: markt ---"
              sudo journalctl -u markt -n 120 --no-pager || true
              echo "--- journal: markt-celery ---"
              sudo journalctl -u markt-celery -n 40 --no-pager || true
              echo "--- listening sockets ---"
              sudo ss -lntp 2>/dev/null | grep -Ei 'gunicorn|python' || true
              exit 1
            fi
            sleep 5
          done

          EOF
